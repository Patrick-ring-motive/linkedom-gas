name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify package
        run: |
          node <<'NODE'
          const { name, version, license } = require('./package.json');
          if (name !== 'linkedom-gas' || license !== 'MIT') {
            throw new Error('Expected linkedom-gas with an MIT license');
          }
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Expected a stable package version: X.Y.Z');
          }
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo 'Invalid version increment' >&2; exit 1 ;;
          esac
          npm version "$BUMP" --no-git-tag-version --ignore-scripts

      - name: Build, test, and pack
        run: |
          mkdir -p release
          npm pack --pack-destination release

      - name: Commit and tag release
        env:
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json index.js THIRD_PARTY_LICENSES.txt
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/v$VERSION"

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Missing GitHub Actions secret NPM_TOKEN' >&2
            exit 1
          fi
          npm publish ./release/linkedom-gas-*.tgz --access public --tag latest --ignore-scripts
